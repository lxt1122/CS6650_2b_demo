# HW6: scrape every Product API task running on ECS every 5 seconds.
# (prometheus.yml is the HW5 config, which scrapes the local app.)
# Task IPs change as tasks scale or get replaced, so the targets come from
# targets/ecs-tasks.json, which hw6-ecs-targets.sh keeps up to date.
# Prometheus reloads that file on its own; no restart needed.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: product-service
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 15s
