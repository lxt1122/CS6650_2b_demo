# HW6: Prometheus + Grafana locally, scraping the Product API deployed on ECS.
# (docker-compose.yml is the HW5 stack, which runs the app locally instead.)
# Start the stack, then keep the ECS task list current in another terminal:
#
#   docker compose -f docker-compose.hw6.yml up
#   ./hw6-ecs-targets.sh
#
#   Prometheus  http://localhost:9090   (Status > Targets shows the scrape)
#   Grafana     http://localhost:3000   (dashboard: "Product API - RED")

# Own project name, so these containers do not share names with the HW5
# stack (docker-compose.yml), which would otherwise also be "observability".
name: hw6-observability

services:
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-hw6.yml:/etc/prometheus/prometheus.yml:ro
      # A directory, not a single file, so Prometheus sees the file the
      # script replaces each time it refreshes.
      - ./targets:/etc/prometheus/targets:ro

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      # Local only: open the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
